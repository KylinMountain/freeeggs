# 领鸡蛋 freeeggs —— 全站安全响应头
#
# 为什么要单独抽一个文件：
# nginx 的 add_header 不会从 server 级继承到「自己写了 add_header」的 location。
# 本项目里 /_astro/、*.html、开放数据这几个 location 各自定义了 Cache-Control，
# 如果不在这里显式 include，安全头就会静默丢失（浏览器看起来一切正常，很难发现）。
#
# 安装到：/etc/nginx/snippets/freeeggs-headers.conf

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 六个月。不加 includeSubDomains，避免影响这台机器上的其他子域名。
add_header Strict-Transport-Security "max-age=15768000" always;
