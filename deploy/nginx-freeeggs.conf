# 领鸡蛋 freeeggs —— nginx 站点配置
#
# 安装步骤（在阿里云服务器上执行）：
#   sudo cp /tmp/freeeggs.conf /etc/nginx/sites-available/freeeggs.conf
#   sudo ln -sf /etc/nginx/sites-available/freeeggs.conf /etc/nginx/sites-enabled/freeeggs.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d freeeggs.xiruistar.cn     # 自动补 443 与 80→443 跳转
#
# 先跑通 HTTP（certbot 需要 80 端口做 HTTP-01 验证），再用 certbot 加证书。

server {
    listen 80;
    listen [::]:80;
    server_name freeeggs.xiruistar.cn;

    root /var/www/freeeggs;
    index index.html;
    charset utf-8;

    # Astro 是 build.format: 'directory'，产物形如 /eggs/index.html。
    # 三条 fallback 覆盖：精确文件 / 目录（自动 301 补斜杠）/ foo.html。
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 构建产物文件名带内容哈希，可以长缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 不缓存：合并 PR 之后刷新就能看到，不用等 CDN 过期
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # 开放数据与订阅源
    location ~* ^/(eggs\.json|rss\.xml|sitemap\.xml|robots\.txt)$ {
        add_header Cache-Control "public, max-age=1800";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/freeeggs_access.log;
    error_log  /var/log/nginx/freeeggs_error.log;
}
