# 领鸡蛋 freeeggs —— nginx 站点配置（含 HTTPS）
#
# 全新部署的顺序：
#   1. 先只上 80 端口那一段（或者直接全量上也行，证书不在就先注释掉 ssl_certificate）
#   2. sudo certbot --nginx -d freeeggs.xiruistar.cn
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 依赖：/etc/nginx/snippets/freeeggs-headers.conf（见 deploy/nginx-freeeggs-headers.conf）

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name freeeggs.xiruistar.cn;

    ssl_certificate     /etc/letsencrypt/live/freeeggs.xiruistar.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freeeggs.xiruistar.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/freeeggs;
    index index.html;
    charset utf-8;

    # server 级也 include 一次：没有自定义 add_header 的 location 会继承到这里
    include /etc/nginx/snippets/freeeggs-headers.conf;

    # Astro 是 build.format: 'directory'，产物形如 /eggs/index.html。
    # 三条 fallback 覆盖：精确文件 / 目录（自动 301 补斜杠）/ foo.html。
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 构建产物文件名带内容哈希，可以长缓存。
    # 只用 add_header 一条，不要同时写 expires —— 那会下发两条 Cache-Control。
    location /_astro/ {
        access_log off;
        include /etc/nginx/snippets/freeeggs-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML 不缓存：合并 PR 之后刷新就能看到，不用等缓存过期
    location ~* \.html$ {
        include /etc/nginx/snippets/freeeggs-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # 开放数据与订阅源
    location ~* ^/(eggs\.json|rss\.xml|sitemap\.xml|robots\.txt)$ {
        include /etc/nginx/snippets/freeeggs-headers.conf;
        add_header Cache-Control "public, max-age=1800" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/freeeggs-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    access_log /var/log/nginx/freeeggs_access.log;
    error_log  /var/log/nginx/freeeggs_error.log;
}

server {
    listen 80;
    listen [::]:80;
    server_name freeeggs.xiruistar.cn;
    return 301 https://$host$request_uri;
}
